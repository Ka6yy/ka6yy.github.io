  <script>
    // Тема и язык — до отрисовки, чтобы не мигало.
    (function () {
      var d = document.documentElement;
      try {
        var th = localStorage.getItem('theme');
        if (th === 'light' || th === 'dark') d.dataset.theme = th;
        var lg = localStorage.getItem('lang');
        if (lg === 'ru' || lg === 'en') d.lang = lg;
        else if (!/^ru/i.test(navigator.language || '')) d.lang = 'en';
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <!-- Меловые фильтры: «дрожащая» линия для рамок, подчёркиваний и иконок -->
  <svg width="0" height="0" aria-hidden="true" style="position:absolute">
    <filter id="rough" x="-5%" y="-20%" width="110%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="rough2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </svg>

  <a class="skip" href="#works">К работам</a>

  <header class="top" id="top">
    <div class="wrap top__in">
      <a class="logo" href="#hero" aria-label="localhost — в начало">

        <span class="logo__name">localhost</span>
      </a>
      <nav class="nav" aria-label="Разделы">

      </nav>
      <div class="toggles">
        <div class="seg" role="group" aria-label="Язык / Language">
          <button type="button" data-lang="ru">RU</button>
          <button type="button" data-lang="en">EN</button>
        </div>
        <button type="button" class="icon-btn" id="theme" aria-label="Тема"></button>
      </div>
    </div>
  </header>

  <main>
    <section class="hero" id="hero"></section>

    <section class="section" id="works">
      <div class="wrap">
        <div id="works-head"></div>
        <div class="filters" id="filters" role="toolbar"></div>
        <div class="grid" id="grid"></div>
      </div>
    </section>

    <section class="section" id="about">
      <div class="wrap" id="about-body"></div>
    </section>

    <section class="section" id="contact">
      <div class="wrap contact" id="contact-body"></div>
    </section>
  </main>

  <dialog class="work" id="work" aria-labelledby="work-title"></dialog>

  <noscript>
    <p style="padding:24px;font-family:monospace">Портфолио рисуется скриптом — включите JavaScript.</p>

</body>
</html>
